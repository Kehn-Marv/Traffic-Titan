version: '3.8'

services:
  mock-server:
    build: ./mock-server
    container_name: rust-viz-mock-server
    ports:
      - "8082:8082"
    networks:
      - rust-viz-network

  frontend:
    build: ./frontend
    container_name: rust-viz-frontend
    ports:
      - "3000:80"
    depends_on:
      - mock-server
    networks:
      - rust-viz-network

networks:
  rust-viz-network:
    driver: bridge
