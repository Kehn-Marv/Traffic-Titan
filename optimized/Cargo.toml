[package]
name = "optimized-bookstore"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.6", features = ["sqlite", "runtime-tokio-rustls", "macros"] }
moka = { version = "0.7", features = ["future"] }
env_logger = "0.11"
log = "0.4"
anyhow = "1.0"
